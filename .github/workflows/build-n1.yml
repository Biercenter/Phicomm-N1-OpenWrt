name: Build Phicomm N1 OpenWrt

on:
  workflow_dispatch:
    inputs:
      openwrt_ver:
        description: '🎯 OpenWrt SDK 版本'
        required: true
        default: '25.12.2'
      kernel_ver:
        description: '🐧 Amlogic 内核版本'
        required: true
        default: '6.18.y'
      default_ip:
        description: '🌐 路由器默认后台 IP'
        required: true
        default: '192.168.100.1'
      disable_ipv6:
        description: '🚷 禁用 IPv6'
        required: true
        type: boolean
        default: true
      include_passwall:
        description: '📦 集成: luci-app-passwall'
        type: boolean
        default: true
      include_ssr_plus:
        description: '📦 集成: luci-app-ssr-plus'
        type: boolean
        default: true
      include_zerotier:
        description: '📦 集成: luci-app-zerotier'
        type: boolean
        default: true

env:
  LOCAL_PKGS_DIR: ${{ github.workspace }}/pkgs
  WORK_DIR: ${{ github.workspace }}/amlogic-s9xxx-openwrt
  TZ: Asia/Shanghai

jobs:
  build_firmware:
    name: 构建 N1 固件
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    
    steps:
      - name: 1. 环境初始化
        uses: actions/checkout@v4

      - name: 2. 准备构建工具与依赖
        run: |
          git clone --depth 1 https://github.com/ophub/amlogic-s9xxx-openwrt.git ${WORK_DIR}
          sudo apt-get update
          sudo apt-get install -y $(cat ${WORK_DIR}/make-openwrt/scripts/ubuntu2404-make-openwrt-depends) gh qemu-user-static binfmt-support
          sudo update-binfmts --enable

      - name: 3. 下载第三方插件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ${LOCAL_PKGS_DIR}
          download_plugin() {
            local TAG=$(gh api repos/${{ github.repository }}/releases --jq '.[].tag_name' | grep "^$1" | head -n 1)
            [ -n "$TAG" ] && gh release download "$TAG" --repo "${{ github.repository }}" --dir ${LOCAL_PKGS_DIR} --pattern "*.apk"
          }
          ${{ inputs.include_passwall }} && download_plugin "Passwall-armsr-armv8"
          ${{ inputs.include_ssr_plus }} && download_plugin "SSR-Plus-armsr-armv8"
          ${{ inputs.include_zerotier }} && download_plugin "ZeroTier-armsr-armv8"

      - name: 4. 配置 ImageBuilder 注入
        run: |
          # 准备配置目录
          IB_FILES="${WORK_DIR}/config/imagebuilder/files"
          mkdir -p ${IB_FILES}/etc/uci-defaults
          
          # 写入首启脚本
          cat <<EOF > ${IB_FILES}/etc/uci-defaults/99-custom-settings
          #!/bin/sh
          # 卸载多余插件
          for pkg in luci-app-ddns luci-app-dockerman luci-app-frpc luci-app-frps luci-app-upnp luci-app-wol luci-app-ttyd; do
              apk del -r "\$pkg" 2>/dev/null || true
          done
          # IPv6 设置
          if [ "${{ inputs.disable_ipv6 }}" = "true" ]; then
              uci set dhcp.lan.ra='disabled'; uci set dhcp.lan.ndp='disabled'; uci set dhcp.lan.dhcpv6='disabled'
              uci delete network.lan.ip6assign
              uci commit
          fi
          # 注入自定义配置
          ${{ vars.CUSTOM_UCI }}
          ${{ secrets.SECRET_UCI }}
          exit 0
          EOF
          chmod +x ${IB_FILES}/etc/uci-defaults/99-custom-settings

          # 解析 APK 包名并修改 ImageBuilder 脚本
          cd ${WORK_DIR}
          CUSTOM_PKGS=""
          if [ -d "${LOCAL_PKGS_DIR}" ] && ls ${LOCAL_PKGS_DIR}/*.apk >/dev/null 2>&1; then
              mkdir -p packages && cp ${LOCAL_PKGS_DIR}/*.apk packages/
              for f in packages/*.apk; do
                  NAME=$(tar -xOf "$f" .PKGINFO 2>/dev/null | awk -F ' = ' '/pkgname/ {print $2}')
                  [ -n "$NAME" ] && CUSTOM_PKGS="\$CUSTOM_PKGS $NAME"
              done
          fi
          sed -i "/make image/ s/PACKAGES=\"/& $CUSTOM_PKGS /" config/imagebuilder/imagebuilder.sh
          sed -i '/make image/i \mkdir -p packages && cp -f ${{ env.LOCAL_PKGS_DIR }}/*.apk packages/ 2>/dev/null || true' config/imagebuilder/imagebuilder.sh

      - name: 5. 执行构建与打包
        run: |
          cd ${WORK_DIR}
          # 第一步：生成 Rootfs
          sudo ./config/imagebuilder/imagebuilder.sh "openwrt:${{ inputs.openwrt_ver }}"
          
          # 第二步：寻找并移动 Rootfs
          mkdir -p openwrt-armsr
          find ./output/ -name "*rootfs.tar.gz" -exec cp {} openwrt-armsr/openwrt-armsr-armv8-generic-rootfs.tar.gz \;
          
          # 第三步：打包 N1 镜像
          sudo chmod +x remake
          sudo ./remake -b s905d -k ${{ inputs.kernel_ver }} -p ${{ inputs.default_ip }}
          
          # 第四步：整理归档
          mkdir -p artifact
          IMG=$(find ./out/ -name "*s905d*.img.gz" | head -n 1)
          
          if [ -z "$IMG" ]; then
              echo "❌ 找不到编译好的固件文件！"
              ls -al ./out/ || true
              exit 1
          fi
          
          NEW_NAME="openwrt_N1_${{ inputs.openwrt_ver }}_k${{ inputs.kernel_ver }}_$(date +%Y%m%d).img.gz"
          mv "$IMG" "artifact/$NEW_NAME"

      - name: 6. 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: N1-${{ inputs.openwrt_ver }}-${{ github.run_id }}
          files: ${{ env.WORK_DIR }}/artifact/*.img.gz
          body: |
            ### 🚀 N1 固件构建完成
            - **OpenWrt:** ${{ inputs.openwrt_ver }}
            - **Kernel:** ${{ inputs.kernel_ver }}
            - **IP:** ${{ inputs.default_ip }}
            - **默认密码:** password
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
