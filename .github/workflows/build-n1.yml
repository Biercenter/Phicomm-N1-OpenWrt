name: Build Phicomm N1 OpenWrt

on:
  workflow_dispatch:
    inputs:
      openwrt_ver:
        description: 'OpenWrt 版本'
        required: true
        default: '25.12.2'
      kernel_ver:
        description: '内核版本'
        required: true
        default: '6.18.y'
      default_ip:
        description: '后台 IP 地址'
        required: true
        default: '192.168.100.1'

env:
  PACKAGES: "-luci-app-ddns -luci-app-dockerman -luci-app-frpc -luci-app-frps -luci-app-upnp -luci-app-wol luci-app-ttyd luci-i18n-ttyd-zh-cn"
  LOCAL_PKGS_DIR: "${{ github.workspace }}/pkgs"
  DISABLE_IPV6: "true"
  TZ: Asia/Shanghai

jobs:
  build_firmware:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 准备构建环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # 【优化】精简冗余包，并直接原生安装 apk-tools，彻底告别 Docker
          sudo apt-get install -y --no-install-recommends git wget curl tar gzip xz-utils btrfs-progs unzip dosfstools \
                                  parted bc build-essential jq pigz qemu-user-static binfmt-support gh apk-tools
          sudo update-binfmts --enable

      - name: 3. 自动下载自定义插件 (Passwall / SSR+ / ZeroTier)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ${{ env.LOCAL_PKGS_DIR }}
          echo "开始检索并下载最新的自定义插件 APK..."
          
          download_latest_plugin() {
            local PREFIX=$1
            echo "🔎 正在寻找最新的 [$PREFIX]..."
            LATEST_TAG=$(gh api repos/${{ github.repository }}/releases --jq '.[].tag_name' | grep "^${PREFIX}" | head -n 1)
            
            if [ -n "$LATEST_TAG" ]; then
              echo "✅ 找到目标版本: $LATEST_TAG"
              gh release download "$LATEST_TAG" --repo "${{ github.repository }}" --dir ${{ env.LOCAL_PKGS_DIR }} --pattern "*.apk"
            else
              echo "⚠️ 警告: 未找到匹配 [$PREFIX] 的 Release。"
            fi
          }

          download_latest_plugin "Passwall-armsr-armv8"
          download_latest_plugin "SSR-Plus-armsr-armv8"
          download_latest_plugin "ZeroTier-armsr-armv8"
          
          echo "⬇️ 本地待整合的插件列表："
          ls -lh ${{ env.LOCAL_PKGS_DIR }}

      - name: 4. 克隆打包工具
        run: |
          git clone --depth 1 https://github.com/ophub/amlogic-s9xxx-openwrt.git
          echo "WORK_DIR=$(pwd)/amlogic-s9xxx-openwrt" >> $GITHUB_ENV

      - name: 5. 预置配置与原生生成索引
        run: |
          cd ${{ env.WORK_DIR }}
          mkdir -p config/imagebuilder/files/etc/uci-defaults
          cat <<EOF > config/imagebuilder/files/etc/uci-defaults/99-custom-settings
          #!/bin/sh
          if [ "${{ env.DISABLE_IPV6 }}" = "true" ]; then
              uci set dhcp.lan.ra='disabled'
              uci set dhcp.lan.ndp='disabled'
              uci set dhcp.lan.dhcpv6='disabled'
              uci delete network.lan.ip6assign
              uci commit dhcp
              uci commit network
          fi
          exit 0
          EOF
          chmod +x config/imagebuilder/files/etc/uci-defaults/99-custom-settings

          if [ -d "${{ env.LOCAL_PKGS_DIR }}" ] && [ "$(ls -A ${{ env.LOCAL_PKGS_DIR }})" ]; then
              CUSTOM_PKGS=$(ls ${{ env.LOCAL_PKGS_DIR }}/*.apk 2>/dev/null | xargs -n1 basename | cut -d'_' -f1 | tr '\n' ' ')
              echo "CUSTOM_PKGS=$CUSTOM_PKGS" >> $GITHUB_ENV
              
              # 【核心优化】直接使用 Ubuntu 24.04 原生的 apk 命令生成索引，光速完成
              echo "📦 正在使用原生 apk-tools 生成索引..."
              cd ${{ env.LOCAL_PKGS_DIR }}
              apk index --allow-untrusted -o APKINDEX.tar.gz *.apk
              
              LOCAL_REPO_PATH="file://$(readlink -f .)"
              echo "LOCAL_REPO_URL=$LOCAL_REPO_PATH" >> $GITHUB_ENV
          fi

      - name: 6. 运行 ImageBuilder 生成 Rootfs
        run: |
          cd ${{ env.WORK_DIR }}
          FINAL_PKGS="${{ env.PACKAGES }} ${{ env.CUSTOM_PKGS }}"
          
          sed -i "/make image/ s/PACKAGES=\"[^\"]*\"/PACKAGES=\"$FINAL_PKGS\"/" config/imagebuilder/imagebuilder.sh
          
          # 【核心优化】改进后台注入逻辑，加入超时保护与成功判定，彻底解决注入失败死锁问题
          if [ -n "${{ env.LOCAL_REPO_URL }}" ]; then
            (
              for i in {1..150}; do
                if [ -f "openwrt/repositories.conf" ]; then
                  echo "${{ env.LOCAL_REPO_URL }}" | sudo tee -a openwrt/repositories.conf
                  sudo mkdir -p openwrt/packages
                  sudo cp -r ${{ env.LOCAL_PKGS_DIR }}/*.apk openwrt/packages/ 2>/dev/null || true
                  echo "🎯 成功检测到配置文件，本地源已完成注入！"
                  break
                fi
                sleep 2
              done
            ) &
          fi
          
          sudo chmod +x config/imagebuilder/imagebuilder.sh
          sudo ./config/imagebuilder/imagebuilder.sh "openwrt:${{ github.event.inputs.openwrt_ver }}"

      - name: 7. 执行适配打包并筛选固件
        run: |
          cd ${{ env.WORK_DIR }}
          mkdir -p openwrt-armsr
          
          SOURCE_FILE=$(find output/ -name "openwrt-${{ github.event.inputs.openwrt_ver }}-*-rootfs.tar.gz" | head -n 1)
          cp "$SOURCE_FILE" "openwrt-armsr/openwrt-armsr-armv8-generic-rootfs.tar.gz"
          
          sudo chmod +x remake
          sudo ./remake -b s905d -k ${{ github.event.inputs.kernel_ver }} -p ${{ github.event.inputs.default_ip }}
          
          mkdir -p ./artifact/
          # 严格提取单个文件，避免通配符扩展导致的复制错误
          RAW_FIRMWARE=$(find out/ -type f -name "*s905d*.img.gz" | head -n 1)
          
          if [ -n "$RAW_FIRMWARE" ]; then
              CUR_DATE=$(date +%Y.%m.%d)
              REAL_KERNEL=$(echo $RAW_FIRMWARE | grep -oE "k[0-9]+\.[0-9]+\.[0-9]+")
              [ -z "$REAL_KERNEL" ] && REAL_KERNEL="k${{ github.event.inputs.kernel_ver }}"
              
              NEW_NAME="openwrt_official_amlogic_s905d_${REAL_KERNEL}_${CUR_DATE}.img.gz"
              cp -v "$RAW_FIRMWARE" "./artifact/$NEW_NAME"
              echo "✅ 已提取唯一固件: $NEW_NAME"
          else
            echo "❌ 错误: 未能在 out 目录找到 img.gz 固件！"
            ls -R out/
            exit 1
          fi

      - name: 8. 发布唯一固件到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: N1-${{ github.event.inputs.openwrt_ver }}-${{ github.run_id }}
          name: 🚀 Phicomm-N1-${{ github.event.inputs.openwrt_ver }} 终极定制版
          files: ${{ env.WORK_DIR }}/artifact/*.img.gz
          body: |
            ### 自动构建成功！🎯
            此固件已自动集成了最新编译的以下第三方强力插件：
            - `luci-app-passwall`
            - `luci-app-ssr-plus`
            - `luci-app-zerotier`
            
            **默认后台 IP**: `${{ github.event.inputs.default_ip }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}