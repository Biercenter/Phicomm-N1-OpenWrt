# ... (前面的步骤 1-5 保持不变)

    - name: 6. 执行适配打包 (Remake)
      run: |
        cd ${{ env.WORK_DIR }}
        mkdir -p openwrt-armsr
        
        # 寻找 ImageBuilder 生成的原始 Rootfs
        SOURCE_FILE=$(find output/ -name "openwrt-${{ github.event.inputs.openwrt_ver }}-*-rootfs.tar.gz" | head -n 1)
        if [ -z "$SOURCE_FILE" ]; then
          echo "❌ 错误：在 output 目录没找到 Rootfs 文件！"
          ls -R output/
          exit 1
        fi
        
        cp -v "$SOURCE_FILE" "openwrt-armsr/openwrt-armsr-armv8-generic-rootfs.tar.gz"
        
        sudo chmod +x remake
        # 执行打包 (增加 --debug 模式查看详细过程)
        echo "开始执行 remake 打包..."
        sudo ./remake -b s905d -k ${{ github.event.inputs.kernel_ver }} -p ${{ github.event.inputs.default_ip }}
        
        # 检查是否生成了固件
        echo "=== 检查当前目录下所有生成的文件 ==="
        find . -maxdepth 3 -name "*.img*" -o -name "*.7z*" -o -name "*.xz*"

    - name: 7. 自动识别并整理固件
      run: |
        cd ${{ env.WORK_DIR }}
        mkdir -p ./artifact/
        # 寻找所有生成的固件包，并移动到 artifact 目录
        # ophub 的输出目录通常是 out/ 或 bin/targets/...
        find . -type f \( -name "*.img.gz" -o -name "*.7z" -o -name "*.xz" -o -name "*.img" \) -exec cp -v {} ./artifact/ \;
        
        if [ -z "$(ls -A ./artifact/)" ]; then
          echo "❌ 严重错误：未能找到任何打包好的固件文件！"
          exit 1
        fi

    - name: 8. 上传固件至 Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: N1-${{ github.event.inputs.openwrt_ver }}-${{ github.run_id }}
        name: Phicomm-N1-OpenWrt-${{ github.event.inputs.openwrt_ver }}
        files: ${{ env.WORK_DIR }}/artifact/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
