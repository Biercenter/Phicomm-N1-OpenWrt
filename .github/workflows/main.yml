name: Build and Release luci-app-passwall

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '架构代号 (例如 armsr-armv8, x86-64)'
        required: true
        default: 'armsr-armv8'
      sdk_url:
        description: 'OpenWrt SDK 下载地址 (支持 .tar.zst 或 .tar.xz)'
        required: true
        default: 'https://downloads.openwrt.org/releases/25.12.2/targets/armsr/armv8/openwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          path: passwall-source

      - name: 安装编译依赖 (含 zstd)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gzip gettext patch wget file subversion libncurses-dev zlib1g-dev unzip zstd

      - name: 下载并解压 OpenWrt SDK
        run: |
          SDK_URL="${{ github.event.inputs.sdk_url }}"
          FILENAME=$(basename "$SDK_URL")
          wget "$SDK_URL" -O "$FILENAME"

          case "$FILENAME" in
            *.tar.zst)
              tar --zstd -xf "$FILENAME"
              ;;
            *.tar.xz)
              tar -xJf "$FILENAME"
              ;;
            *)
              echo "错误：不支持的压缩格式 ($FILENAME)"
              exit 1
              ;;
          esac

          # 统一目录名
          mv openwrt-sdk-* openwrt-sdk

      - name: 复制 PassWall 源码到 SDK
        run: |
          mkdir -p openwrt-sdk/package/luci-app-passwall
          cp -r passwall-source/luci-app-passwall/* openwrt-sdk/package/luci-app-passwall/

      - name: 更新 feeds 并安装依赖
        run: |
          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 编译 luci-app-passwall
        run: |
          cd openwrt-sdk
          # 确保包被选中
          echo "CONFIG_PACKAGE_luci-app-passwall=m" >> .config
          make defconfig
          make package/luci-app-passwall/compile V=s -j$(nproc)

      - name: 上传编译产物 (IPK)
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-passwall-${{ github.event.inputs.arch }}
          path: |
            openwrt-sdk/bin/packages/*/base/luci-app-passwall*.ipk
            openwrt-sdk/bin/packages/*/luci/luci-app-passwall*.ipk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载编译产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 显示文件结构 (便于调试)
        run: ls -R artifacts/

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.arch }}-${{ github.run_number }}
          files: artifacts/**/*.ipk
          body: |
            🔹 架构：`${{ github.event.inputs.arch }}`
            🔹 SDK：`${{ github.event.inputs.sdk_url }}`
            🔹 构建 ID：${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}