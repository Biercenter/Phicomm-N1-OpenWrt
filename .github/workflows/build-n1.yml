name: Build OpenWrt for Amlogic s905d

on:
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点击运行
  # push:          # 如果需要每次推送代码自动触发，取消注释此行
  #   branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Clone Repository & Install Dependencies
        run: |
          echo "==== Clone Repository ===="
          git clone --depth 1 https://github.com/ophub/amlogic-s9xxx-openwrt.git
          cd amlogic-s9xxx-openwrt
          
          echo "==== Install Ubuntu 24.04 Dependencies ===="
          sudo apt-get update -y
          sudo apt-get install -y $(cat make-openwrt/scripts/ubuntu2404-make-openwrt-depends)

      - name: Modify Configuration and Scripts
        working-directory: amlogic-s9xxx-openwrt
        run: |
          echo "==== 更改config/imagebuilder/config和config/imagebuilder/imagebuilder.sh ===="
          sed -i 's/^CONFIG_PACKAGE/# &/' config/imagebuilder/config
          sed -i '$a\
          CONFIG_PACKAGE_luci-app-passwall=y\
          CONFIG_PACKAGE_luci-app-zerotier=y\
          CONFIG_PACKAGE_luci-app-ssr-plus=y\
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y\
          CONFIG_PACKAGE_luci-i18n-zerotier-zh-cn=y\
          CONFIG_PACKAGE_luci-i18n-ssr-plus-zh-cn=y\
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y\
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y\
          CONFIG_PACKAGE_openssh-sftp-server=y\
          CONFIG_PACKAGE_kmod-nft-tproxy=y\
          CONFIG_PACKAGE_kmod-nft-socket=y\
          ' config/imagebuilder/config
          
          sed -i -E 's/\b(docker(-compose)?|dockerd)\b\s*//g' config/imagebuilder/imagebuilder.sh
          sed -i 's/tini ttyd tune2fs/tini tune2fs/g' config/imagebuilder/imagebuilder.sh

      - name: Inject Plugin Download Script
        working-directory: amlogic-s9xxx-openwrt
        run: |
          cat > /tmp/insert_code.txt << 'EOF'
          PLUGINS=("ZeroTier" "SSR-Plus" "Passwall")
          for NAME in "${PLUGINS[@]}"; do
              echo "-----------------------------------------------"
              echo "正在搜索 $NAME 的最新发布版本..."
              
              # 注意：如果在 Actions 中遇到 GitHub API 速率限制，可在 workflow 环境变量中配置 GITHUB_TOKEN
              DOWNLOAD_URLS=$(curl -s https://api.github.com/repos/Biercenter/Phicomm-N1-OpenWrt/releases | \
              python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for release in data:
              if '$NAME' in release['name']:
                  for asset in release['assets']:
                      if asset['name'].endswith('.apk'):
                          print(asset['browser_download_url'])
                  break
              ")

              if [ -z "$DOWNLOAD_URLS" ]; then
                  echo "❌ 未找到 $NAME 的相关 apk 文件。"
              else
                  echo "✅ 找到 $NAME 的文件，开始下载..."
                  echo "$DOWNLOAD_URLS" | xargs -n 1 wget -q --show-progress -nc
              fi
          done

          echo "-----------------------------------------------"
          echo "全部下载完成！文件保存在: $(pwd)"
          ls -lh *.apk
          EOF
          sed -i '/Download other luci-app-xxx/r /tmp/insert_code.txt' config/imagebuilder/imagebuilder.sh
          rm /tmp/insert_code.txt

      - name: Add Custom UCI Defaults
        working-directory: amlogic-s9xxx-openwrt
        run: |
          echo "==== 添加files/etc/uci-defaults/ ===="
          mkdir -p config/imagebuilder/files/etc/uci-defaults/
          cat > config/imagebuilder/files/etc/uci-defaults/zzz-custom-settings << 'EOF'
          cd /mnt/mmcblk2p4/uci-set/
          ./full.sh
          EOF
          chmod +x config/imagebuilder/files/etc/uci-defaults/zzz-custom-settings

      - name: Build OpenWrt RootFS
        working-directory: amlogic-s9xxx-openwrt
        run: |
          echo "==== 开始制作openwrt-armsr-armv8-generic-rootfs.tar.gz ===="
          sudo ./config/imagebuilder/imagebuilder.sh openwrt:25.12.2

      - name: Package Firmware
        working-directory: amlogic-s9xxx-openwrt
        run: |
          echo "==== 开始打包openwrt_official_amlogic_s905d_k6.18.24_2026.04.26.img.gz ===="
          mkdir -p openwrt-armsr/
          sudo mv output/openwrt-*-rootfs.tar.gz openwrt-armsr/openwrt-armsr-armv8-generic-rootfs.tar.gz
          sudo ./remake -b s905d -k 6.18.y -p 192.168.100.1
          
          echo "==== 制作完成 ===="
          ls -hl openwrt/out/*.img.gz

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Firmware-s905d
          path: amlogic-s9xxx-openwrt/openwrt/out/*.img.gz
          compression-level: 0 # 固件已是 gz 格式，无需二次压缩
          retention-days: 7    # 保存天数，可按需修改
