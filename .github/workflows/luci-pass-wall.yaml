name: Universal Build luci-app-passwall

on:
  workflow_dispatch:
    # 定义可视化界面的输入参数
    inputs:
      sdk_url:
        description: '🎯 OpenWrt SDK 下载链接 (.tar.zst)'
        required: true
        type: string
        default: 'https://downloads.openwrt.org/releases/25.12.2/targets/armsr/armv8/openwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst'
      arch_name:
        description: '🏷️ 架构名称 (用于输出文件命名，如 armsr-armv8, x86_64)'
        required: true
        type: string
        default: 'armsr-armv8'
      source_branch:
        description: '🌿 Passwall 源码分支'
        required: true
        type: string
        default: 'main'
      use_cache:
        description: '⚡ 启用源码缓存 (加快二次编译速度)'
        required: true
        type: boolean
        default: true

env:
  # 官方源码库地址作为固定常量保留
  PASSWALL_PKG_REPO: "https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git"
  PASSWALL_LUCI_REPO: "https://github.com/Openwrt-Passwall/openwrt-passwall.git"

jobs:
  build:
    name: Build Passwall (${{ inputs.arch_name }})
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd

      - name: Cache Downloaded Sources
        # 只有在表单中勾选了启用缓存时才执行
        if: ${{ inputs.use_cache }}
        uses: actions/cache@v4
        with:
          path: sdk_dir/dl
          # 【优化】缓存键值加入了架构名称，避免跨架构缓存污染
          key: ${{ runner.os }}-openwrt-dl-${{ inputs.arch_name }}-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-${{ inputs.arch_name }}-

      - name: Download and Extract OpenWrt SDK
        run: |
          echo "Downloading SDK from: ${{ inputs.sdk_url }}"
          # 动态读取填写的 SDK 链接
          wget -q -O sdk.tar.zst "${{ inputs.sdk_url }}"
          
          echo "Extracting SDK..."
          tar -I zstd -xf sdk.tar.zst
          mv openwrt-sdk-* sdk_dir

      - name: Add Passwall Feeds
        working-directory: ./sdk_dir
        run: |
          # 动态读取填写的源码分支
          echo "src-git passwall_packages ${{ env.PASSWALL_PKG_REPO }};${{ inputs.source_branch }}" >> feeds.conf.default
          echo "src-git passwall_luci ${{ env.PASSWALL_LUCI_REPO }};${{ inputs.source_branch }}" >> feeds.conf.default
          cat feeds.conf.default

      - name: Update and Install Feeds
        working-directory: ./sdk_dir
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Defconfig
        working-directory: ./sdk_dir
        run: |
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_LUCI_LANG_zh_cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-passwall-zh-Hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-passwall-zh_Hans=y" >> .config
          
          make defconfig

      - name: Compile luci-app-passwall
        working-directory: ./sdk_dir
        run: |
          make package/luci-app-passwall/compile -j$(nproc) || make package/luci-app-passwall/compile -j1 V=s

      - name: Collect APK Files
        run: |
          mkdir -p output_apk
          find sdk_dir/bin/ -type f -name "*.apk" -exec cp {} output_apk/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          # 动态命名输出的压缩包
          name: luci-app-passwall-${{ inputs.arch_name }}
          path: output_apk/*.apk
          if-no-files-found: error
