name: Build OpenWrt SDK Plugins

on:
  workflow_dispatch: # 支持手动触发

env:
  SDK_URL: https://downloads.openwrt.org/releases/25.12.2/targets/armsr/armv8/openwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialization Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev \
            file wget zstd curl swig jq

      - name: Download and Extract SDK
        run: |
          wget -O sdk.tar.zst $SDK_URL
          tar -I zstd -xf sdk.tar.zst
          # 动态获取解压后的目录名
          echo "SDK_DIR=$(ls -d openwrt-sdk-*)" >> $GITHUB_ENV

      - name: Configure Feeds
        run: |
          cd ${{ env.SDK_DIR }}
          cp feeds.conf.default feeds.conf
          echo "src-git helloworld https://github.com/fw876/helloworld.git;master" >> feeds.conf
          echo "src-git immortal_luci https://github.com/immortalwrt/luci.git;master" >> feeds.conf
          echo "src-git amlogic https://github.com/ophub/luci-app-amlogic.git;main" >> feeds.conf
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 精准安装确保链接正确
          ./scripts/feeds install -p immortal_luci luci-app-passwall
          ./scripts/feeds install -p immortal_luci luci-app-zerotier
          ./scripts/feeds install -p helloworld luci-app-ssr-plus
          ./scripts/feeds install -p amlogic luci-app-amlogic

      - name: Patch & Fix Recursive Dependency
        run: |
          cd ${{ env.SDK_DIR }}
          # 修复 libcurl 循环依赖
          [ -f "feeds/packages/net/curl/Config.in" ] && sed -i 's/depends on PACKAGE_libcurl//g' feeds/packages/net/curl/Config.in
          # 修复 Passwall 循环依赖
          [ -f "feeds/immortal_luci/applications/luci-app-passwall/Makefile" ] && sed -i 's/select PACKAGE_sing-box//g' feeds/immortal_luci/applications/luci-app-passwall/Makefile

      - name: Custom Configuration
        run: |
          cd ${{ env.SDK_DIR }}
          make defconfig
          
          # 禁用全量编译提速
          sed -i 's/CONFIG_ALL=y/# CONFIG_ALL is not set/' .config
          sed -i 's/CONFIG_ALL_KMODS=y/# CONFIG_ALL_KMODS is not set/' .config
          sed -i 's/CONFIG_ALL_NONSHARED=y/# CONFIG_ALL_NONSHARED is not set/' .config
          
          # 开启中文支持
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          
          # 精简 Passwall 核心
          cat <<EOF >> .config
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Server is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Trojan_Plus is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin is not set
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_sing-box-tiny=n
          EOF

          # 选中目标插件
          echo "CONFIG_PACKAGE_luci-app-passwall=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-zerotier=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-ssr-plus=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-amlogic=m" >> .config
          
          make defconfig

      - name: Compile Plugins
        run: |
          cd ${{ env.SDK_DIR }}
          make download -j8
          make package/luci-app-passwall/compile V=s -j$(nproc)
          make package/luci-app-zerotier/compile V=s -j$(nproc)
          make package/luci-app-ssr-plus/compile V=s -j$(nproc)
          make package/luci-app-amlogic/compile V=s -j$(nproc)

      - name: Organize Files
        run: |
          mkdir -p bin_out
          find ${{ env.SDK_DIR }}/bin/ -name "*.ipk" -exec cp {} bin_out/ \;
          cd bin_out && tar -cvf ../plugins_armv8.tar .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Plugins-armv8
          path: bin_out/*.ipk
