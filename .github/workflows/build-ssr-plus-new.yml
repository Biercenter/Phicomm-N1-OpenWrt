name: 编译新版SSR-PLUS

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: '🎯 OpenWrt SDK 下载链接 (.tar.zst)'
        required: true
        type: string
        default: 'https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/openwrt-sdk-25.12.5-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst'
      arch_name:
        description: '🏷️ 架构名称'
        required: true
        type: string
        default: 'armsr-armv8'
      source_branch:
        description: '🌿 SSR-Plus (helloworld) 源码分支'
        required: true
        type: string
        default: 'dev'
      use_cache:
        description: '⚡ 启用源码缓存'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  HELLOWORLD_REPO: "https://github.com/fw876/helloworld.git"

jobs:
  build:
    name: Build SSR-Plus (${{ inputs.arch_name }})
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Tag Date
        id: tag_date
        run: echo "date=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd

      - name: Cache Downloaded Sources
        if: ${{ inputs.use_cache }}
        uses: actions/cache@v4
        with:
          path: sdk_dir/dl
          key: ${{ runner.os }}-openwrt-dl-${{ inputs.arch_name }}-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-${{ inputs.arch_name }}-

      - name: Download and Extract OpenWrt SDK
        run: |
          echo "Downloading SDK..."
          wget -q -O sdk.tar.zst "${{ inputs.sdk_url }}"
          
          echo "Extracting SDK..."
          rm -rf sdk_dir
          mkdir -p sdk_dir
          tar -I zstd -xf sdk.tar.zst -C sdk_dir --strip-components=1

      - name: Add SSR-Plus Feeds
        working-directory: ./sdk_dir
        run: |
          echo "src-git helloworld ${{ env.HELLOWORLD_REPO }};${{ inputs.source_branch }}" >> feeds.conf.default

      - name: 更新 Feeds 并替换最新版Golang
        working-directory: ./sdk_dir
        run: |
          ./scripts/feeds update -a
          cd feeds/packages
          git checkout FETCH_HEAD -- lang/golang
          cd ../..
          ./scripts/feeds update -i packages
          ./scripts/feeds install -f -p packages golang
          ./scripts/feeds install -a -f -p helloworld

      - name: Generate Defconfig
        working-directory: ./sdk_dir
        run: |
         touch .config
         echo '# CONFIG_ALL is not set' > .config
         echo '# CONFIG_ALL_KMODS is not set' >> .config
         echo '# CONFIG_ALL_NONSHARED is not set' >> .config
         echo 'CONFIG_LUCI_LANG_zh_Hans=y' >> .config
         echo 'CONFIG_PACKAGE_luci-app-ssr-plus=m' >> .config
         echo 'CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Xray=y' >> .config
         echo 'CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_NONE_V2RAY=n' >> .config
         echo 'CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_ShadowsocksR_Libev_Client=n' >> .config
          
          make defconfig

      - name: Compile luci-app-ssr-plus
        working-directory: ./sdk_dir
        run: |
          # 优先使用多核编译，失败则输出详细日志
          make package/luci-app-ssr-plus/compile -j$(nproc) || make package/luci-app-ssr-plus/compile -j1 V=s
          make package/xray-core/compile -j$(nproc) || make package/xray-core/compile -j1 V=s
          make package/mihomo/compile -j$(nproc) || make package/mihomo/compile -j1 V=s

      - name: Collect Output Files
        run: |
          mkdir -p output_artifacts
          # 查找并收集 .apk 或 .ipk 文件
          find sdk_dir/bin/ -type f \( -name "*.apk" -o -name "*.ipk" \) -path "*/helloworld/*" -exec cp {} output_artifacts/ \;

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SSR-Plus-${{ inputs.arch_name }}-${{ steps.tag_date.outputs.date }}
          name: 🚀 SSR-Plus (${{ inputs.arch_name }}) - ${{ steps.tag_date.outputs.date }}
          files: output_artifacts/*
          body: |
            ### 自动化编译结果
            - **架构**: `${{ inputs.arch_name }}`
            - **SDK**: `${{ inputs.sdk_url }}`
            - **状态**: 成功 (已禁用 Shadowsocks-Rust 以通过编译)
            - **文件**: 包含 SSR-Plus 及其所有依赖包
