name: 制作 Amlogic s905d OpenWrt 固件

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本号 (输入格式如: 25.12.4)'
        required: true
        default: '25.12.4'
        type: string
      with_passwall:
        description: '是否集成 Passwall'
        required: false
        type: boolean
        default: true
      with_ssr_plus:
        description: '是否集成 SSR-Plus'
        required: false
        type: boolean
        default: true
      with_zerotier:
        description: '是否集成 ZeroTier'
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # 授予发布 Release 所需的权限
    permissions:
      contents: write

    steps:
      - name: 1. 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 2. 克隆源码与安装依赖
        run: |
          echo "==== 正在克隆 ophub 仓库 ===="
          git clone --depth 1 https://github.com/ophub/amlogic-s9xxx-openwrt.git
          cd amlogic-s9xxx-openwrt
          
          echo "==== 正在安装 Ubuntu 24.04 编译环境依赖 ===="
          sudo apt-get update -y
          sudo apt-get install -y $(cat make-openwrt/scripts/ubuntu2404-make-openwrt-depends)
          sudo apt-get clean

      - name: 3. 动态配置插件列表
        working-directory: amlogic-s9xxx-openwrt
        run: |
          echo "==== 正在根据用户选择配置插件 ===="
          CONFIG_FILE="config/imagebuilder/config"
          
          # 注释掉默认的包配置，由我们后面动态添加
          sed -i 's/^CONFIG_PACKAGE/# &/' $CONFIG_FILE
          
          # 基础必须包
          {
            echo "CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y"
            echo "CONFIG_PACKAGE_openssh-sftp-server=y"
            echo "CONFIG_PACKAGE_kmod-nft-tproxy=y"
            echo "CONFIG_PACKAGE_kmod-nft-socket=y"
            echo "CONFIG_PACKAGE_luci-i18n-commands-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-i18n-acme-zh-cn=y"
            echo "CONFIG_PACKAGE_acme-acmesh-dnsapi=y"
          } >> $CONFIG_FILE

          # 根据 Actions 页面勾选情况添加插件
          if [ "${{ github.event.inputs.with_passwall }}" == "true" ]; then
            echo "CONFIG_PACKAGE_luci-app-passwall=y" >> $CONFIG_FILE
            echo "CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y" >> $CONFIG_FILE
          fi

          if [ "${{ github.event.inputs.with_ssr_plus }}" == "true" ]; then
            echo "CONFIG_PACKAGE_luci-app-ssr-plus=y" >> $CONFIG_FILE
            echo "CONFIG_PACKAGE_luci-i18n-ssr-plus-zh-cn=y" >> $CONFIG_FILE
          fi

          if [ "${{ github.event.inputs.with_zerotier }}" == "true" ]; then
            echo "CONFIG_PACKAGE_luci-app-zerotier=y" >> $CONFIG_FILE
            echo "CONFIG_PACKAGE_luci-i18n-zerotier-zh-cn=y" >> $CONFIG_FILE
          fi

          echo "==== 移除多余服务(Docker/TTYD)并精简脚本 ===="
          sed -i -E 's/\b(docker(-compose)?|dockerd)\b\s*//g' config/imagebuilder/imagebuilder.sh
          sed -i 's/tini ttyd tune2fs/tini tune2fs/g' config/imagebuilder/imagebuilder.sh

      - name: 4. 注入插件自动化下载逻辑
        working-directory: amlogic-s9xxx-openwrt
        run: |
          # 构建需要下载的插件数组
          SELECTED_PLUGINS=()
          [ "${{ github.event.inputs.with_zerotier }}" == "true" ] && SELECTED_PLUGINS+=("ZeroTier")
          [ "${{ github.event.inputs.with_ssr_plus }}" == "true" ] && SELECTED_PLUGINS+=("SSR-Plus")
          [ "${{ github.event.inputs.with_passwall }}" == "true" ] && SELECTED_PLUGINS+=("Passwall")

          # 将数组转为字符串形式存入脚本
          PLUGIN_LIST_STR=$(printf '"%s" ' "${SELECTED_PLUGINS[@]}")

          cat > /tmp/insert_code.txt << EOF
          PLUGINS=($PLUGIN_LIST_STR)
          for NAME in "\${PLUGINS[@]}"; do
              echo "-----------------------------------------------"
              echo "正在搜索 \$NAME (armsr-armv8) 的【最新】发布版本..."
              DOWNLOAD_URLS=\$(curl -s https://api.github.com/repos/Biercenter/Phicomm-N1-OpenWrt/releases | \\
              python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for release in data:
              # 由于 GitHub API 默认按时间倒序排列，第一个匹配到的即为最新版本
              if '\$NAME' in release['name'] and 'armsr-armv8' in release['name']:
                  for asset in release['assets']:
                      if asset['name'].endswith('.apk'):
                          print(asset['browser_download_url'])
                  # 核心拦截逻辑：找到最新版本后，使用 break 立即跳出外层循环，忽略旧版本
                  break
              ")
              if [ -z "\$DOWNLOAD_URLS" ]; then
                  echo "❌ 未找到 \$NAME (armsr-armv8) 的相关 apk 文件。"
              else
                  echo "✅ 成功锁定 \$NAME (armsr-armv8) 最新版本，开始下载..."
                  echo "\$DOWNLOAD_URLS" | xargs -n 1 wget -q --show-progress -nc
              fi
          done
          EOF
          
          # 将下载逻辑插入到 imagebuilder.sh 脚本的对应位置
          sed -i '/Download other luci-app-xxx/r /tmp/insert_code.txt' config/imagebuilder/imagebuilder.sh
          rm /tmp/insert_code.txt

      - name: 5. 配置自定义启动脚本 (UCI Defaults)
        working-directory: amlogic-s9xxx-openwrt
        run: |
          echo "==== 正在添加自定义初次启动设置 ===="
          mkdir -p config/imagebuilder/files/etc/uci-defaults/
          cat > config/imagebuilder/files/etc/uci-defaults/zzz-custom-settings << 'EOF'
          # 这里可以放置你初次开机想执行的命令
          cd /mnt/mmcblk2p4/uci-set/
          [ -f "./full.sh" ] && chmod +x ./full.sh && ./full.sh
          EOF
          chmod +x config/imagebuilder/files/etc/uci-defaults/zzz-custom-settings

      - name: 6. 编译 RootFS 根文件系统
        working-directory: amlogic-s9xxx-openwrt
        run: |
          echo "==== 正在通过 ImageBuilder 制作 RootFS ===="
          # 使用用户输入的版本号，默认为 25.12.4
          sudo ./config/imagebuilder/imagebuilder.sh openwrt:${{ github.event.inputs.openwrt_version }}

      - name: 7. 打包成 Amlogic 写入镜像 (.img.gz)
        working-directory: amlogic-s9xxx-openwrt
        run: |
          echo "==== 正在打包 s905d 专用固件 ===="
          mkdir -p openwrt-armsr/
          # 移动生成的 rootfs 到指定目录供 remake 使用
          sudo mv output/openwrt-*-rootfs.tar.gz openwrt-armsr/openwrt-armsr-armv8-generic-rootfs.tar.gz
          # 执行打包命令，指定内核 6.18.y 和默认 IP
          sudo ./remake -b s905d -k 6.18.y -p 192.168.100.1
          
          echo "==== 编译完成，准备发布 ===="
          # 设置一个环境变量存储当前日期，用于 Release 标签
          echo "RELEASE_TAG=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: 8. 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt_official_amlogic_s905d_${{ env.RELEASE_TAG }}
          name: OpenWrt 固件 - Amlogic s905d (${{ env.RELEASE_TAG }})
          body: |
            ## 固件信息
            - 设备型号: Amlogic s905d
            - OpenWrt 版本: ${{ github.event.inputs.openwrt_version }}
            - 编译时间: ${{ env.RELEASE_TAG }}
            - 集成插件状态:
              - Passwall: ${{ github.event.inputs.with_passwall == 'true' && '✔' || '❌' }}
              - SSR-Plus: ${{ github.event.inputs.with_ssr_plus == 'true' && '✔' || '❌' }}
              - ZeroTier: ${{ github.event.inputs.with_zerotier == 'true' && '✔' || '❌' }}
            **注意**：下载下方的 `.img.gz` 文件后解压烧录即可。
          files: amlogic-s9xxx-openwrt/openwrt/out/*.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
