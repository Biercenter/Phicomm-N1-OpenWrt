name: Build luci-app-passwall

on:
  # 允许手动触发工作流
  workflow_dispatch:

env:
  # 你提供的 SDK 下载地址
  SDK_URL: https://downloads.openwrt.org/releases/25.12.2/targets/armsr/armv8/openwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予创建 Release 的权限

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 安装编译环境依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget zstd

    - name: 下载并解压 OpenWrt SDK
      run: |
        wget -O openwrt-sdk.tar.zst ${{ env.SDK_URL }}
        tar -I zstd -xf openwrt-sdk.tar.zst
        # 重命名解压后的目录以便后续操作
        mv openwrt-sdk-* openwrt-sdk

    - name: 添加 Passwall 源码仓库
      run: |
        cd openwrt-sdk
        # 将 passwall 的依赖包和 luci 应用添加到 feeds.conf.default
        echo "src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git;main" >> feeds.conf.default
        echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main" >> feeds.conf.default
        
        # 更新并安装 feed
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 编译 luci-app-passwall
      run: |
        cd openwrt-sdk
        # 生成默认配置文件
        make defconfig
        # 单独编译 passwall 及其依赖包，V=s 用于输出详细日志以便排错
        make package/luci-app-passwall/compile V=s

    - name: 收集编译好的 IPK 文件
      id: collect
      run: |
        mkdir -p ${{ github.workspace }}/release_packages
        # 在 sdk/bin 目录下找到所有生成的 .ipk 文件并复制到发布文件夹
        find openwrt-sdk/bin/ -name "*.ipk" -exec cp {} ${{ github.workspace }}/release_packages/ \;
        # 生成当前时间作为 Release 的 Tag
        echo "RELEASE_TAG=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV

    - name: 上传 Artifacts (可选)
      uses: actions/upload-artifact@v4
      with:
        name: passwall-ipk-armsr-armv8
        path: ${{ github.workspace }}/release_packages/

    - name: 发布至 GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Passwall for armsr-armv8 - ${{ env.RELEASE_TAG }}
        body: |
          编译目标: armsr/armv8
          SDK 版本: openwrt-sdk-25.12.2-armsr-armv8
          包含 luci-app-passwall 及其所需依赖 (Xray, Sing-box 等)。
        files: ${{ github.workspace }}/release_packages/*.ipk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
