name: Build luci-app-passwall

on:
  workflow_dispatch:
  # push:
  #   branches: [ "main" ]

env:
  SDK_URL: "https://downloads.openwrt.org/releases/25.12.2/targets/armsr/armv8/openwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
  PASSWALL_PKG_REPO: "https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git"
  PASSWALL_LUCI_REPO: "https://github.com/Openwrt-Passwall/openwrt-passwall.git"
  REPO_BRANCH: "main" 

jobs:
  build:
    name: Build Passwall using SDK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # 使用了你提供的完整版 OpenWrt 编译依赖，并保留了 zstd 和 curl
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd

      - name: Download and Extract OpenWrt SDK
        run: |
          echo "Downloading SDK..."
          wget -q -O sdk.tar.zst ${{ env.SDK_URL }}
          
          echo "Extracting SDK..."
          tar -I zstd -xf sdk.tar.zst
          mv openwrt-sdk-* sdk_dir

      - name: Add Passwall Feeds
        working-directory: ./sdk_dir
        run: |
          cp feeds.conf.default feeds.conf.default.bak
          echo "src-git passwall_packages ${{ env.PASSWALL_PKG_REPO }};${{ env.REPO_BRANCH }}" >> feeds.conf.default
          echo "src-git passwall_luci ${{ env.PASSWALL_LUCI_REPO }};${{ env.REPO_BRANCH }}" >> feeds.conf.default
          cat feeds.conf.default

      - name: Update and Install Feeds
        working-directory: ./sdk_dir
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Defconfig
        working-directory: ./sdk_dir
        run: |
          # 设定 LuCI 全局语言为简体中文 (新版规范 zh_Hans)
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-passwall-zh-Hans=y" >> .config
          
          make defconfig

      - name: Compile luci-app-passwall
        working-directory: ./sdk_dir
        run: |
          # 使用 -j$(nproc) 跑满多核性能
          make package/luci-app-passwall/compile -j$(nproc) V=s

      - name: Collect APK Files
        run: |
          mkdir -p output_apk
          find sdk_dir/bin/ -type f -name "*.apk" -exec cp {} output_apk/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-passwall-armsr-armv8
          path: output_apk/*.apk
          if-no-files-found: error
