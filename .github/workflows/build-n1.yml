name: Build Phicomm N1 OpenWrt

on:
  workflow_dispatch:
    inputs:
      openwrt_ver:
        description: 'OpenWrt 官方版本'
        required: true
        default: '25.12.2'
      kernel_ver:
        description: '晶晨内核版本'
        required: true
        default: '6.18.y'
      default_ip:
        description: '默认后台 IP'
        required: true
        default: '192.168.100.1'

# ----------------- [ 全局变量配置中心 ] -----------------
env:
  # 需要卸载的官方插件 (前面加 '-' 表示不打包进入镜像)
  # 需要增加的官方插件直接写名字 (例如 luci-app-ttyd)
  PACKAGES: "-luci-app-ddns -luci-app-dockerman -luci-app-frpc -luci-app-frps -luci-app-upnp -luci-app-wol luci-app-ttyd luci-i18n-ttyd-zh-cn"
  
  # 本地私有包目录 (相对于仓库根目录)
  LOCAL_PKGS_DIR: "pkgs"
  
  # 是否禁用 IPv6 (true/false)
  DISABLE_IPV6: "true"
  
  TZ: Asia/Shanghai
# ------------------------------------------------------

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 准备构建环境 (修复 apk-tools 报错)
      run: |
        sudo add-apt-repository universe -y
        sudo apt-get update
        sudo apt-get install -y git wget curl tar gzip xz-utils btrfs-progs unzip dosfstools \
                                parted bc build-essential jq pigz qemu-user-static binfmt-support apk-tools
        sudo update-binfmts --enable

    - name: 3. 克隆并进入 ophub 仓库
      run: |
        git clone --depth 1 https://github.com/ophub/amlogic-s9xxx-openwrt.git
        echo "WORK_DIR=$(pwd)/amlogic-s9xxx-openwrt" >> $GITHUB_ENV

    - name: 4. 预置自定义配置与本地私有包
      run: |
        cd ${{ env.WORK_DIR }}
        # 创建初始化脚本目录
        mkdir -p config/imagebuilder/files/etc/uci-defaults
        
        # 写入初始化逻辑 (IP/IPv6)
        cat <<EOF > config/imagebuilder/files/etc/uci-defaults/99-custom-settings
        #!/bin/sh
        # 禁用 IPv6
        if [ "${{ env.DISABLE_IPV6 }}" = "true" ]; then
            uci set dhcp.lan.ra='disabled'
            uci set dhcp.lan.ndp='disabled'
            uci set dhcp.lan.dhcpv6='disabled'
            uci delete network.lan.ip6assign
            uci commit dhcp
            uci commit network
        fi
        exit 0
        EOF
        chmod +x config/imagebuilder/files/etc/uci-defaults/99-custom-settings

        # 处理本地私有 APK 文件
        if [ -d "../${{ env.LOCAL_PKGS_DIR }}" ]; then
            echo "检测到本地私有包目录，正在集成..."
            # 获取所有私有包名并加入构建清单
            CUSTOM_PKGS=$(ls ../${{ env.LOCAL_PKGS_DIR }}/*.apk 2>/dev/null | xargs -n1 basename | cut -d'_' -f1 | tr '\n' ' ')
            echo "CUSTOM_PKGS=$CUSTOM_PKGS" >> $GITHUB_ENV
            
            # 为本地包生成索引，否则 ImageBuilder 无法识别仓库
            cd ../${{ env.LOCAL_PKGS_DIR }}
            apk index -o APKINDEX.tar.gz *.apk
            cd ${{ env.WORK_DIR }}
            
            # 创建本地仓库路径配置
            LOCAL_REPO_URL="file://$(readlink -f ../${{ env.LOCAL_PKGS_DIR }})"
            echo "LOCAL_REPO_URL=$LOCAL_REPO_URL" >> $GITHUB_ENV
        fi

    - name: 5. 运行 ImageBuilder 生成 Rootfs
      run: |
        cd ${{ env.WORK_DIR }}
        
        # 动态修改镜像包清单 (注入本地包名和剔除包名)
        FINAL_PKGS="${{ env.PACKAGES }} ${{ env.CUSTOM_PKGS }}"
        sed -i "/make image/ s/PACKAGES=\"[^\"]*\"/PACKAGES=\"$FINAL_PKGS\"/" config/imagebuilder/imagebuilder.sh
        
        # 注入本地仓库路径
        # 在脚本运行期间动态修改 repositories.conf
        (
          while [ ! -f "openwrt/repositories.conf" ]; do sleep 2; done
          echo "src custom_repo ${{ env.LOCAL_REPO_URL }}" | sudo tee -a openwrt/repositories.conf
        ) &
        
        sudo chmod +x config/imagebuilder/imagebuilder.sh
        sudo ./config/imagebuilder/imagebuilder.sh "openwrt:${{ github.event.inputs.openwrt_ver }}"

    - name: 6. 执行适配打包 (Remake)
      run: |
        cd ${{ env.WORK_DIR }}
        mkdir -p openwrt-armsr
        
        # 移动并重命名生成的 rootfs
        SOURCE_FILE="output/openwrt-${{ github.event.inputs.openwrt_ver }}-armsr-armv8-generic-rootfs.tar.gz"
        cp "$SOURCE_FILE" "openwrt-armsr/openwrt-armsr-armv8-generic-rootfs.tar.gz"
        
        sudo chmod +x remake
        sudo ./remake -b s905d -k ${{ github.event.inputs.kernel_ver }} -p ${{ github.event.inputs.default_ip }}

    - name: 7. 上传固件到 Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.openwrt_ver }}-${{ github.event.inputs.kernel_ver }}-${{ github.run_id }}
        name: Phicomm-N1-OpenWrt-${{ github.event.inputs.openwrt_ver }}
        files: ${{ env.WORK_DIR }}/out/*.img.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
