name: Build Phicomm N1 OpenWrt

# 触发条件：点击 Actions 页面上的按钮手动运行
on:
  workflow_dispatch:
    inputs:
      openwrt_ver:
        description: 'OpenWrt Version'
        required: true
        default: '25.12.2'
      kernel_ver:
        description: 'Kernel Version'
        required: true
        default: '6.18.y'
      default_ip:
        description: 'Default LAN IP'
        required: true
        default: '192.168.100.1'

env:
  REMOVE_PKGS: "-luci-app-ddns -luci-app-dockerman -luci-app-frpc -luci-app-frps -luci-app-upnp -luci-app-wol"
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 安装构建环境
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget curl tar gzip xz-utils btrfs-progs unzip dosfstools \
                                parted bc build-essential jq pigz qemu-user-static binfmt-support apk-tools
        sudo update-binfmts --enable

    - name: 3. 克隆 ophub 打包工具
      run: |
        git clone --depth 1 https://github.com/ophub/amlogic-s9xxx-openwrt.git
        cd amlogic-s9xxx-openwrt

    - name: 4. 配置自定义插件与 SDK 仓库
      run: |
        cd amlogic-s9xxx-openwrt
        # 创建 uci-defaults 目录
        mkdir -p config/imagebuilder/files/etc/uci-defaults
        
        # 写入初始化配置
        cat <<EOF > config/imagebuilder/files/etc/uci-defaults/99-custom-settings
        #!/bin/sh
        # 禁用 IPv6
        uci set dhcp.lan.ra='disabled'
        uci set dhcp.lan.ndp='disabled'
        uci set dhcp.lan.dhcpv6='disabled'
        uci delete network.lan.ip6assign
        uci commit dhcp
        uci commit network
        
        # 处理本地私有包 (如果有的话)
        if [ -d "/opt/my_pkgs" ]; then
            apk add --allow-untrusted /opt/my_pkgs/*.apk
            rm -rf /opt/my_pkgs
        fi
        exit 0
        EOF
        chmod +x config/imagebuilder/files/etc/uci-defaults/99-custom-settings

        # 如果仓库里有 pkgs 目录，则放入 ImageBuilder 的 files 目录
        if [ -d "../pkgs" ]; then
            mkdir -p config/imagebuilder/files/opt/my_pkgs
            cp ../pkgs/*.apk config/imagebuilder/files/opt/my_pkgs/ || true
            # 生成 APK 索引以便 ImageBuilder 识别
            cd ../pkgs && apk index -o APKINDEX.tar.gz *.apk && cd ../amlogic-s9xxx-openwrt
        fi

    - name: 5. 运行 ImageBuilder 生成 Rootfs
      run: |
        cd amlogic-s9xxx-openwrt
        # 修改脚本以注入自定义包
        sed -i "/make image/ s/PACKAGES=\"[^\"]*\"/PACKAGES=\"${{ env.REMOVE_PKGS }}\"/" config/imagebuilder/imagebuilder.sh
        sudo chmod +x config/imagebuilder/imagebuilder.sh
        sudo ./config/imagebuilder/imagebuilder.sh "openwrt:${{ github.event.inputs.openwrt_ver }}"

    - name: 6. 执行适配打包 (remake)
      run: |
        cd amlogic-s9xxx-openwrt
        mkdir -p openwrt-armsr
        cp output/openwrt-${{ github.event.inputs.openwrt_ver }}-armsr-armv8-generic-rootfs.tar.gz openwrt-armsr/openwrt-armsr-armv8-generic-rootfs.tar.gz
        sudo chmod +x remake
        sudo ./remake -b s905d -k ${{ github.event.inputs.kernel_ver }} -p ${{ github.event.inputs.default_ip }}

    - name: 7. 整理文件并发布
      run: |
        cd amlogic-s9xxx-openwrt/out
        echo "RELEASE_TAG=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV
        # 打包后的固件通常是 .img.gz
        echo "FIRMWARE_PATH=$(pwd)" >> $GITHUB_ENV

    - name: 8. 上传固件到 GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        files: amlogic-s9xxx-openwrt/out/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
