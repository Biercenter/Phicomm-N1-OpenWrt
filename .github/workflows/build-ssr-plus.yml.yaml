name: Universal Build luci-app-ssr-plus

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: '🎯 OpenWrt SDK 下载链接 (.tar.zst)'
        required: true
        type: string
        default: 'https://downloads.openwrt.org/releases/25.12.2/targets/armsr/armv8/openwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst'
      arch_name:
        description: '🏷️ 架构名称'
        required: true
        type: string
        default: 'armsr-armv8'
      source_branch:
        description: '🌿 SSR-Plus (helloworld) 源码分支'
        required: true
        type: string
        default: 'master'
      use_cache:
        description: '⚡ 启用源码缓存'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  HELLOWORLD_REPO: "https://github.com/fw876/helloworld.git"

jobs:
  build:
    name: Build SSR-Plus (${{ inputs.arch_name }})
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Tag Date
        id: tag_date
        run: echo "date=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd

      - name: Cache Downloaded Sources
        if: ${{ inputs.use_cache }}
        uses: actions/cache@v4
        with:
          path: sdk_dir/dl
          key: ${{ runner.os }}-openwrt-dl-${{ inputs.arch_name }}-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-${{ inputs.arch_name }}-

      - name: Download and Extract OpenWrt SDK
        run: |
          wget -q -O sdk.tar.zst "${{ inputs.sdk_url }}"
          tar -I zstd -xf sdk.tar.zst
          mv openwrt-sdk-* sdk_dir

      - name: Add SSR-Plus Feeds
        working-directory: ./sdk_dir
        run: |
          echo "src-git helloworld ${{ env.HELLOWORLD_REPO }};${{ inputs.source_branch }}" >> feeds.conf.default

      - name: Update and Install Feeds
        working-directory: ./sdk_dir
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Defconfig
        working-directory: ./sdk_dir
        run: |
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_LUCI_LANG_zh_cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-ssr-plus-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-ssr-plus-zh-Hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-ssr-plus-zh_Hans=y" >> .config
          make defconfig

      - name: Compile luci-app-ssr-plus
        working-directory: ./sdk_dir
        run: |
          make package/luci-app-ssr-plus/compile -j$(nproc) || make package/luci-app-ssr-plus/compile -j1 V=s

      - name: Collect Custom APK Files
        run: |
          mkdir -p output_apk
          # 仅提取 helloworld 源中生成的 APK
          find sdk_dir/bin/ -type f -path "*/helloworld/*" -name "*.apk" -exec cp {} output_apk/ \;

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SSR-Plus-${{ inputs.arch_name }}-${{ steps.tag_date.outputs.date }}
          name: 🚀 SSR-Plus (${{ inputs.arch_name }}) - ${{ steps.tag_date.outputs.date }}
          files: output_apk/*.apk
          body: |
            ### 自动化编译结果
            - **编译目标架构**: `${{ inputs.arch_name }}`
            - **使用的 SDK**: `${{ inputs.sdk_url }}`
            - **源码分支**: `${{ inputs.source_branch }}`
            - *仅包含 SSR-Plus (helloworld) 及其核心依赖包。*